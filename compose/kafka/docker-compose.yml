version: "3.9"

networks:
  local-externo:
    driver: bridge

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.10
    container_name: zookeeper
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - local-externo
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-kafka:7.6.10
    container_name: broker
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2018M
        reservations:
          cpus: '0.5'
          memory: 1024M
    networks:
      - local-externo
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"     # acesso externo
      - "29092:29092"   # interno/debug opcional
      - "7071:7071"
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "29092"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://host.docker.internal:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter/kafka-jmx-config.yml -Xms512M -Xmx512M"
    volumes:
      - ./jmx_prometheus_javaagent.jar:/opt/jmx_exporter/jmx_prometheus_javaagent.jar
      - ./kafka-jmx-config.yml:/opt/jmx_exporter/kafka-jmx-config.yml 

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - local-externo
    depends_on:
      - broker
    ports:
      - "7777:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      
  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: kafka-exporter
    # Mantendo apenas o essencial que funciona em todas as versões
    command: ["--kafka.server=broker:29092"]
    ports:
      - "9308:9308"
    networks:
      - local-externo
    # O Docker vai tentar subir o container de novo se ele der 'exit'
    restart: always 
    depends_on:
      broker:
        condition: service_healthy # Só tenta subir quando o broker estiver pronto
