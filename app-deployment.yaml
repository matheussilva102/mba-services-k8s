---
# =================================================
# ATALHO PARA CROSS-NAMESPACE (GRAFANA)
# =================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana-internal-proxy
spec:
  type: ExternalName
  externalName: prometheus-stack-grafana.monitoring.svc.cluster.local

---
# =================================================
# INGRESS
# =================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - http:
      paths:
      - path: /accounts(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: service-conta
            port:
              number: 80
      - path: /autos(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: service-auto
            port:
              number: 80
      - path: /offers(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: service-oferta
            port:
              number: 80

---
# =================================================
# INGRESS 2: MONITORAMENTO (COM REWRITE)
# =================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - path: /grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-internal-proxy
            port:
              number: 80
---
# =================================================
# MONITORAMENTO
# =================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apps-service-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      monitor: app
  namespaceSelector:
    any: true
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 15s
    scrapeTimeout: 10s